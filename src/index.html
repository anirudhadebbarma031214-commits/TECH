<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NXT Browser</title><link rel="stylesheet" href="style.css"></head>
<body><header class="top"><div class="brand"><span class="logo">N</span><span>NXT <b>Browser</b></span></div><span class="status">ANI STUDIO · DESKTOP</span></header>
<div class="tabsbar" id="tabsbar"><button id="newTab" class="new-tab" title="New tab">+</button></div>
<nav class="toolbar"><button id="back" title="Back">←</button><button id="forward" title="Forward">→</button><button id="reload" title="Reload">↻</button><button id="home" title="Home">⌂</button><form id="addressForm"><span class="lock">⌕</span><input id="address" autocomplete="off" spellcheck="false" placeholder="Search or enter website address"><button type="submit" class="go">Go</button></form><button id="bookmark" title="Bookmark">☆</button><button id="menu" title="Shortcuts">⋮</button></nav>
<main id="views"><section class="welcome" id="welcome"><div class="hero-mark">N</div><p class="eyebrow">YOUR WEB. YOUR SPACE.</p><h1>Welcome to <span>NXT Browser</span></h1><p class="sub">A clean, fast desktop browser by ANI STUDIO.</p><form id="searchForm" class="searchbox"><span>⌕</span><input id="searchInput" placeholder="Search the web or type a URL" autocomplete="off"><button>Search</button></form><div class="quicklinks"><button data-url="https://www.google.com">Google</button><button data-url="https://www.youtube.com">YouTube</button><button data-url="https://github.com">GitHub</button><button data-url="https://www.wikipedia.org">Wikipedia</button></div><p class="footnote">Chromium-powered browsing · Your browsing traffic is handled by the websites you visit.</p></section></main><div id="toast" role="status"></div><script src="renderer.js"></script></body></html>
